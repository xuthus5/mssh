name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  WAILS_VERSION: 'v3.0.0-beta.2'

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwebkitgtk-6.0-4 \
            rpm file libfuse2 fuse3 desktop-file-utils wget flatpak flatpak-builder ostree appstream jq
          df -h
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(tr -d '\r\n' < .wails-version)
      - name: Resolve version
        id: version
        run: |
          VERSION="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Prepare AppImage runtime
        run: |
          set -euo pipefail
          case "${{ matrix.goarch }}" in
            amd64) runtime_arch="x86_64" ;;
            arm64) runtime_arch="aarch64" ;;
            *) echo "unsupported AppImage arch: ${{ matrix.goarch }}" >&2; exit 1 ;;
          esac
          runtime_dir="${RUNNER_TEMP}/appimage-runtime"
          mkdir -p "${runtime_dir}"
          runtime_file="${runtime_dir}/runtime-${runtime_arch}"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${runtime_arch}" \
            --output "${runtime_file}"
          chmod 0755 "${runtime_file}"
          echo "LDAI_RUNTIME_FILE=${runtime_file}" >> "${GITHUB_ENV}"
      - name: Build and package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.goarch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          wails3 task linux:build ARCH=${{ matrix.goarch }} PRODUCTION=true APP_VERSION=${APP_VERSION}
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb ARCH=${{ matrix.goarch }} APP_VERSION=${APP_VERSION}
          wails3 task linux:generate:rpm ARCH=${{ matrix.goarch }} APP_VERSION=${APP_VERSION}
          wails3 task linux:create:appimage ARCH=${{ matrix.goarch }} APP_VERSION=${APP_VERSION}
          bash build/linux/flatpak/validate.sh
          wails3 task linux:create:flatpak ARCH=${{ matrix.goarch }} APP_VERSION=${APP_VERSION}
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          cp "bin/mssh" "dist/mssh-${VERSION}-linux-${ARCH}"
          test -s "dist/mssh-${VERSION}-linux-${ARCH}"

          mapfile -t debs < <(find bin -maxdepth 1 -type f -name '*.deb' | sort)
          mapfile -t rpms < <(find bin -maxdepth 1 -type f -name '*.rpm' | sort)
          mapfile -t appimages < <(find bin -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.appimage' \) | sort)

          if [[ ${#debs[@]} -eq 0 || ${#rpms[@]} -eq 0 ]]; then
            echo "Missing deb/rpm packages in bin/" >&2
            ls -la bin
            exit 1
          fi

          cp "${debs[0]}" "dist/mssh-${VERSION}-linux-${ARCH}.deb"
          cp "${rpms[0]}" "dist/mssh-${VERSION}-linux-${ARCH}.rpm"

          appimage_src=""
          if [[ ${#appimages[@]} -gt 0 ]]; then
            for f in "${appimages[@]}"; do
              base="$(basename "$f")"
              case "$base" in
                linuxdeploy*) continue ;;
                mssh-*.AppImage|mssh-*.appimage) appimage_src="$f"; break ;;
                mssh.AppImage|mssh.appimage) appimage_src="$f" ;;
                *.AppImage|*.appimage) appimage_src="${appimage_src:-$f}" ;;
              esac
            done
          fi
          if [[ -z "${appimage_src}" ]]; then
            echo "Missing AppImage in bin/" >&2
            ls -la bin
            exit 1
          fi
          cp "${appimage_src}" "dist/mssh-${VERSION}-linux-${ARCH}.AppImage"
          chmod 0755 "dist/mssh-${VERSION}-linux-${ARCH}.AppImage"

          mapfile -t flatpaks < <(find bin -maxdepth 1 -type f -name '*.flatpak' | sort)
          flatpak_src=""
          if [[ ${#flatpaks[@]} -gt 0 ]]; then
            for f in "${flatpaks[@]}"; do
              base="$(basename "$f")"
              case "$base" in
                mssh-*.flatpak) flatpak_src="$f"; break ;;
                mssh.flatpak) flatpak_src="$f" ;;
                *.flatpak) flatpak_src="${flatpak_src:-$f}" ;;
              esac
            done
          fi
          if [[ -z "${flatpak_src}" ]]; then
            echo "Flatpak bundle missing in bin/" >&2
            ls -la bin
            exit 1
          fi
          cp "${flatpak_src}" "dist/mssh-${VERSION}-linux-${ARCH}.flatpak"
          test -s "dist/mssh-${VERSION}-linux-${ARCH}.flatpak"

          ls -la bin dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install NSIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '3.12'
          $root = Join-Path $env:RUNNER_TEMP 'nsis'
          $zip = Join-Path $env:RUNNER_TEMP "nsis-$version.zip"
          $makensis = Join-Path $root "nsis-$version\makensis.exe"
          function Install-NsisChocolatey {
            Write-Host "Installing NSIS via Chocolatey"
            choco install nsis -y --no-progress --attempts=3
          }
          function Test-ZipFile {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return $false }
            if ((Get-Item $Path).Length -le 1MB) { return $false }
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            return $bytes.Length -ge 2 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B
          }
          if (-not (Test-Path $makensis)) {
            if (-not (Test-Path $zip)) {
              $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$version/nsis-$version.zip"
              $downloaded = $false
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
                curl.exe -L --fail --silent --show-error -o $zip $url
                if ($LASTEXITCODE -eq 0 -and (Test-ZipFile $zip)) {
                  $downloaded = $true
                  break
                }
                Write-Host "NSIS download attempt $attempt failed or produced an invalid archive; retrying"
                if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
              }
              if (-not $downloaded) { Install-NsisChocolatey }
            }
            if (Test-Path $zip) {
              try {
                Expand-Archive -Path $zip -DestinationPath $root -Force
              } catch {
                Write-Host "Expand-Archive failed; falling back to Chocolatey: $_"
                Install-NsisChocolatey
              }
            }
            if (-not (Test-Path $makensis)) {
              $candidates = @(
                "C:\Program Files (x86)\NSIS\makensis.exe",
                "C:\Program Files\NSIS\makensis.exe"
              )
              $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if (-not $makensis) { throw "makensis.exe not found (SourceForge download or Chocolatey fallback)" }
          & $makensis /VERSION
          "MAKENSIS_NATIVE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(tr -d '\r\n' < .wails-version)
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and package
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${MAKENSIS_NATIVE:-}"
          powershell -NoProfile -Command 'if (-not (Test-Path $env:MAKENSIS_NATIVE)) { throw "MAKENSIS_NATIVE not found: $env:MAKENSIS_NATIVE" }'
          wails3 task windows:build ARCH=${{ matrix.goarch }} PRODUCTION=true APP_VERSION=${APP_VERSION}
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          go run ./scripts/release/nsis_runner.go \
            -arch "${{ matrix.goarch }}" \
            -binary bin/mssh.exe \
            -dir build/windows/nsis
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          test -s "bin/mssh.exe"
          cp "bin/mssh.exe" "dist/mssh-${VERSION}-windows-${ARCH}.exe"
          mapfile -t installers < <(find bin -maxdepth 1 -type f -iname '*installer*.exe' | sort)
          if ((${#installers[@]} != 1)); then
            echo "expected exactly one NSIS installer, found ${#installers[@]}" >&2
            ls -la bin
            exit 1
          fi
          cp "${installers[0]}" "dist/mssh-${VERSION}-windows-${ARCH}-installer.exe"
          test -s "dist/mssh-${VERSION}-windows-${ARCH}-installer.exe"
          ls -la bin dist
      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  darwin:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(tr -d '\r\n' < .wails-version)
      - name: Resolve version
        id: version
        run: |
          VERSION="nightly-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build macOS app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: 1
        run: |
          set -euo pipefail
          wails3 task darwin:package ARCH=${{ matrix.arch }} PRODUCTION=true APP_VERSION=${APP_VERSION}
      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          test -d "bin/mssh.app"
          ditto -c -k --sequesterRsrc --keepParent "bin/mssh.app" "dist/mssh-${VERSION}-darwin-${ARCH}.app.zip"
          test -s "dist/mssh-${VERSION}-darwin-${ARCH}.app.zip"
          ls -la bin dist
      - uses: actions/upload-artifact@v5
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Nightly Release
    needs: [linux, windows, darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f -print -exec cp {} upload/ \;
          ls -la upload
          test "$(find upload -maxdepth 1 -type f | wc -l)" -gt 0
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd upload
          sha256sum * > mssh-nightly-SHA256SUMS
          cat mssh-nightly-SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="nightly"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Updating existing nightly release..."
            for asset in $(gh release view "${RELEASE_TAG}" --json assets -q '.assets[].name'); do
              gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes 2>/dev/null || true
            done
          else
            echo "Creating new nightly release..."
            gh release create "${RELEASE_TAG}" \
              --title "Nightly Build" \
              --notes "Nightly build from \`${GITHUB_SHA:0:7}\` ($(date -u +%Y-%m-%d))" \
              --prerelease
          fi
          gh release upload "${RELEASE_TAG}" upload/* --clobber
          echo "Nightly release ${RELEASE_TAG} updated with latest artifacts"
