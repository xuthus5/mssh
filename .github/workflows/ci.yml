name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(tr -d '\r\n' < .wails-version)
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint version
      - name: Ensure frontend embed assets
        run: |
          mkdir -p frontend/dist
          if [ ! -f frontend/dist/placeholder.txt ]; then
            printf '%s\n' 'mssh frontend embed placeholder' > frontend/dist/placeholder.txt
            chmod 600 frontend/dist/placeholder.txt
          fi
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: CI gate (task ci)
        # Single source of truth with local `wails3 task ci`
        run: wails3 task ci

  windows-compatibility:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Run Agent CLI process tests
        shell: bash
        run: >-
          go test ./internal/service
          -run 'Test(AIAgentWindowsProcessLifecycleKillsDescendants|RunAIAgentCLIProcess)'
          -count=1
      - name: Build Windows backend
        run: go build ./internal/app

  performance:
    name: Commercial performance benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Capture benchmark samples
        run: |
          set -euo pipefail
          umask 077
          mkdir -p performance
          go test -run '^$' -bench 'BenchmarkCommercial|BenchmarkWailsEventBus' -benchmem -count=3 \
            ./internal/store ./internal/service ./pkg/event | tee performance/commercial-benchmarks.txt
          test -s performance/commercial-benchmarks.txt
      - name: Upload benchmark samples
        uses: actions/upload-artifact@v4
        with:
          name: commercial-performance
          path: performance/commercial-benchmarks.txt
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Flatpak and Flathub manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream flatpak flatpak-builder jq
      - name: Validate local Flatpak manifest
        run: bash build/linux/flatpak/validate.sh build/linux/flatpak/io.github.xuthus5.mssh.yml
      - name: Validate Flathub submission manifest
        env:
          VERIFY_FLATHUB_SOURCE: '1'
        run: bash build/linux/flatpak/validate.sh build/linux/flatpak/io.github.xuthus5.mssh.flathub.yml

  e2e:
    name: E2E SSH/SFTP/tmux/serial
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Install E2E services
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client tmux
      - name: Verify E2E tools
        run: |
          set -euo pipefail
          command -v sshd
          command -v ssh-keygen
          command -v tmux
      - name: Run real SSH/SFTP/tmux gate
        run: go test -race -tags=e2e ./e2e -run 'TestCommercialSSHWorkflow|TestConcurrentResourcesReturnToBaseline' -count=1 -timeout=2m
      - name: Run serial PTY integration gate
        run: go test -race -tags=e2e ./internal/serial -run '^TestSerialPTYIntegration$' -count=1 -timeout=30s
