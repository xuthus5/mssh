version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: mssh
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'
  APP_VERSION:
    sh: |
      set -e
      if [ -n "${APP_VERSION:-}" ]; then
        printf '%s' "$APP_VERSION" | tr -d '\r' | head -n1 | sed 's/^v//'
        exit 0
      fi
      tag="$(git describe --tags --exact-match 2>/dev/null || true)"
      if [ -n "$tag" ]; then
        printf '%s' "$tag" | sed 's/^v//'
        exit 0
      fi
      printf '%s' '0.1.0'
  VERSION_LDFLAGS: '-X github.com/xuthus5/mssh/internal/service.Version={{.APP_VERSION}}'
  GO_VERSION:
    sh: tr -d '\r\n' < .go-version
  NODE_VERSION:
    sh: tr -d '\r\n' < .node-version
  WAILS_VERSION:
    sh: tr -d '\r\n' < .wails-version

tasks:
  build:
    summary: Builds the application for the current platform
    cmds:
      - task: "{{OS}}:build"
        vars:
          PRODUCTION: '{{.PRODUCTION | default "true"}}'
          ARCH: '{{.ARCH | default ARCH}}'
          APP_VERSION: '{{.APP_VERSION}}'

  package:
    summary: Packages a production build for the current platform
    cmds:
      - task: "{{OS}}:package"
        vars:
          APP_VERSION: '{{.APP_VERSION}}'
          ARCH: '{{.ARCH | default ARCH}}'

  package:linux:amd64:
    summary: Linux amd64 packages (binary, deb, rpm, AppImage, Flatpak)
    cmds:
      - task: linux:package
        vars:
          ARCH: amd64
          APP_VERSION: '{{.APP_VERSION}}'

  package:linux:arm64:
    summary: Linux arm64 packages (binary, deb, rpm, AppImage, Flatpak)
    cmds:
      - task: linux:package
        vars:
          ARCH: arm64
          APP_VERSION: '{{.APP_VERSION}}'


  package:linux:flatpak:
    summary: Linux Flatpak bundle for current arch
    cmds:
      - task: linux:create:flatpak
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
          APP_VERSION: '{{.APP_VERSION}}'

  package:windows:amd64:
    summary: Windows amd64 installer + exe
    cmds:
      - task: windows:package
        vars:
          ARCH: amd64
          APP_VERSION: '{{.APP_VERSION}}'

  package:windows:arm64:
    summary: Windows arm64 installer + exe
    cmds:
      - task: windows:package
        vars:
          ARCH: arm64
          APP_VERSION: '{{.APP_VERSION}}'

  package:darwin:universal:
    summary: macOS universal .app bundle
    cmds:
      - task: darwin:package:universal
        vars:
          APP_VERSION: '{{.APP_VERSION}}'

  dev:
    summary: Run application in development mode
    cmds:
      - cmd: PATH="$HOME/.govm/go/bin:$PATH" CGO_ENABLED=1 wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
        platforms: [linux]
      - cmd: PATH="$HOME/.govm/go/bin:$PATH" wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
        platforms: [darwin]
      - cmd: powershell -NoProfile -Command "$env:PATH=\"$env:USERPROFILE\.govm\go\bin;$env:PATH\"; wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}"
        platforms: [windows]

  compile:
    summary: Production build for the current platform
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"

  lint:
    summary: Run golangci-lint with the same version and flags as CI
    vars:
      GOLANGCI_LINT_VERSION: '{{.GOLANGCI_LINT_VERSION | default "v2.12.2"}}'
    cmds:
      - |
        set -euo pipefail
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not found; install with: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}"
          exit 1
        fi
        golangci-lint version
        golangci-lint run --timeout 5m ./...

  toolchain:check:
    summary: Verify the pinned local build toolchain
    cmds:
      - |
        set -euo pipefail
        actual_go="$(go version | awk '{print $3}')"
        actual_node="$(node --version | sed 's/^v//')"
        actual_wails="$(wails3 version 2>&1 | tr -d '\r')"
        test "${actual_go#go}" = "{{.GO_VERSION}}"
        test "${actual_node}" = "{{.NODE_VERSION}}"
        test "${actual_wails}" = "{{.WAILS_VERSION}}"
        printf 'toolchain verified: go=%s node=%s wails=%s\n' "$actual_go" "$actual_node" "$actual_wails"

  fmt:
    summary: Format Go code (golangci formatters + goimports-reviser)
    cmds:
      - golangci-lint run --fix ./...
      - goimports-reviser -rm-unused -format ./...

  test:
    summary: Backend tests with race + CI coverage gate (>=90%)
    cmds:
      - |
        set -euo pipefail
        go test -race -coverprofile=coverage.out -covermode=atomic \
          -coverpkg=./internal/...,./pkg/... ./internal/... ./pkg/...
        go tool cover -func=coverage.out | tee coverage.func.txt
        go tool cover -func=coverage.out | grep total | awk '{if ($3+0 < 90) { print "coverage below 90%:", $3; exit 1 }}'

  test:frontend:
    summary: Frontend checks matching CI (source limits, bundle budget, vitest)
    dir: frontend
    cmds:
      - npm run check:source-limits
      - npm run check:bundle-budget
      - npm test
      - npm audit --audit-level=high --registry=https://registry.npmjs.org

  test:e2e:
    summary: Run real SSH/tmux/SFTP/serial integration tests
    cmds:
      - go test -race -tags=e2e ./e2e -run 'TestCommercialSSHWorkflow|TestConcurrentResourcesReturnToBaseline' -count=1 -timeout=2m
      - go test -race -tags=e2e ./internal/serial -run '^TestSerialPTYIntegration$' -count=1 -timeout=30s

  test:windows:
    summary: Verify Windows backend compatibility
    cmds:
      - cmd: |
          set -euo pipefail
          windows_test_dir="$(mktemp -d)"
          trap 'rm -rf -- "$windows_test_dir"' EXIT
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c \
            -o "$windows_test_dir/mssh-service.test.exe" ./internal/service
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./internal/app
        platforms: [linux, darwin]
      - cmd: go test ./internal/service -run 'Test(AIAgentWindowsProcessLifecycleKillsDescendants|RunAIAgentCLIProcess)' -count=1
        platforms: [windows]
      - cmd: go build ./internal/app
        platforms: [windows]

  benchmark:
    summary: Run commercial performance benchmarks
    cmds:
      - go test -run '^$' -bench 'BenchmarkCommercial|BenchmarkWailsEventBus' -benchmem ./internal/store ./internal/service ./pkg/event

  benchmark:ci:
    summary: Capture reproducible commercial performance benchmarks
    cmds:
      - |
        set -euo pipefail
        mkdir -p performance
        go test -run '^$' -bench 'BenchmarkCommercial|BenchmarkWailsEventBus' -benchmem -count=3 \
          ./internal/store ./internal/service ./pkg/event | tee performance/commercial-benchmarks.txt
        test -s performance/commercial-benchmarks.txt

  release:check:
    summary: Validate release workflow hardening
    cmds:
      - bash scripts/release/validate-workflow.sh
      - bash scripts/release/test-metadata.sh

  ci:
    summary: Full local gate aligned with .github/workflows/ci.yml
    desc: |
      Mirrors CI: golangci-lint, backend race+coverage, Windows compatibility, frontend checks, production build.
      Run before every commit/push. Fails fast on the first failing stage.
    cmds:
      - task: toolchain:check
      - task: lint
      - task: test
      - task: test:windows
      - node scripts/check-go-source-limits.mjs
      - task: test:frontend
      - task: build
        vars:
          PRODUCTION: "true"

  check:
    summary: Alias for task ci (pre-commit / pre-push gate)
    cmds:
      - task: ci

  clean:
    summary: Clean temporary build artifacts
    cmds:
      - cmd: rm -f coverage.out coverage.func.txt
        platforms: [linux, darwin]
      - cmd: rm -rf performance
        platforms: [linux, darwin]
      - cmd: rm -rf bin build/bin
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "Remove-Item coverage.out,coverage.func.txt,performance,bin,build/bin -Recurse -Force -ErrorAction SilentlyContinue"
        platforms: [windows]
      - go clean -testcache
